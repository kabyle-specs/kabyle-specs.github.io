<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';">
<title>Viewer | Kabyle Language Specs</title>
<meta name="description" content="Markdown viewer for Kabyle Language Specifications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
  :root{
    --paper: #EBE5D3;
    --paper-raised: #F4EFE1;
    --ink: #202A22;
    --ink-soft: #4B564A;
    --line: #C9C0A4;
    --blue: #2E5C74;
    --olive: #57682F;
    --ochre: #B8842B;
    --yaz: #A34433;
    --display: "Fraunces", serif;
    --body: "Work Sans", sans-serif;
    --mono: "IBM Plex Mono", monospace;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: var(--blue); text-decoration: none; }
  a:hover{ color: var(--yaz); text-decoration: underline; }
  a:focus-visible{ outline: 2px solid var(--yaz); outline-offset: 3px; }

  header{
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner{
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .brand a{ display:flex; align-items:center; gap: 10px; color: inherit; }
  .brand a:hover{ text-decoration: none; }
  .brand a:hover .brand-text{ color: var(--yaz); }
  .brand-text{
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
    transition: color 0.15s ease;
  }
  .brand-text small{
    display:block;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 0.65rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 0.75rem;
    text-decoration: none;
    padding: 7px 12px;
    border: 1px solid var(--ink);
    border-radius: 3px;
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn:hover{ background: var(--ink); color: var(--paper-raised); text-decoration: none; }
  .btn.primary{ background: var(--ink); color: var(--paper); }
  .btn.primary:hover{ background: var(--yaz); border-color: var(--yaz); color: var(--paper-raised); }

  .layout{
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 40px;
    align-items: start;
  }

  aside{
    position: sticky;
    top: 80px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding-right: 8px;
  }
  aside::-webkit-scrollbar{ width: 5px; }
  aside::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 3px; }

  .toc-title{
    font-family: var(--mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .doc-card{
    margin-bottom: 16px;
    padding: 10px 12px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .doc-card .doc-title{
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.92rem;
    line-height: 1.3;
    margin: 0 0 4px;
  }
  .doc-card .doc-path{
    font-family: var(--mono);
    font-size: 0.7rem;
    word-break: break-all;
    color: var(--ink-soft);
  }
  .doc-card .status{
    display:inline-block;
    padding: 2px 7px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 6px;
  }
  .status.draft{ background: #ECE0C6; color: #7A5A16; }
  .status.proposed{ background: #DCE6E9; color: var(--blue); }
  .status.stable{ background: #DEE6D2; color: var(--olive); }
  .status.analysis{ background: #E8DED8; color: var(--yaz); }

  .toc ul{
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .toc li{ margin: 0; }
  .toc a{
    display: block;
    font-family: var(--body);
    font-size: 0.88rem;
    line-height: 1.35;
    color: var(--ink-soft);
    padding: 4px 0;
    border-left: 2px solid transparent;
    padding-left: 10px;
    margin-left: -2px;
    text-decoration: none;
  }
  .toc a:hover{ color: var(--yaz); border-left-color: var(--yaz); }
  .toc a.active{ color: var(--ink); border-left-color: var(--olive); font-weight: 500; }
  .toc .level-h3{ padding-left: 22px; font-size: 0.82rem; }

  main{ min-width: 0; }
  article{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px 44px;
    max-width: 820px;
  }

  article h1, article h2, article h3, article h4{
    font-family: var(--display);
    font-weight: 600;
    line-height: 1.2;
    margin-top: 0;
    scroll-margin-top: 90px;
  }
  article h1{ font-size: 2rem; margin-bottom: 18px; }
  article h2{ font-size: 1.45rem; margin-top: 36px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  article h3{ font-size: 1.15rem; margin-top: 28px; margin-bottom: 10px; color: var(--ink-soft); }
  article h4{ font-size: 1rem; margin-top: 22px; margin-bottom: 8px; }
  article p{ margin: 0 0 14px; }
  article ul, article ol{ margin: 0 0 14px; padding-left: 24px; }
  article li{ margin-bottom: 4px; }
  article li > ul, article li > ol{ margin-bottom: 4px; }
  article blockquote{
    margin: 18px 0;
    padding: 12px 18px;
    border-left: 3px solid var(--yaz);
    background: rgba(163,68,51,0.05);
    color: var(--ink-soft);
    font-style: italic;
  }
  article blockquote p:last-child{ margin-bottom: 0; }
  article code{
    font-family: var(--mono);
    font-size: 0.85em;
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--line);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--ink);
  }
  article pre{
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 16px;
    overflow-x: auto;
    margin: 18px 0;
  }
  article pre code{
    background: none;
    border: none;
    padding: 0;
    color: #e6e6e6;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  article table{
    width: 100%;
    border-collapse: collapse;
    margin: 18px 0;
    font-size: 0.92rem;
  }
  article th, article td{
    border: 1px solid var(--line);
    padding: 8px 12px;
    text-align: left;
  }
  article th{
    background: var(--paper);
    font-weight: 600;
    font-family: var(--display);
  }
  article tr:nth-child(even){ background: rgba(0,0,0,0.02); }
  article hr{
    border: none;
    border-top: 1px solid var(--line);
    margin: 28px 0;
  }
  article img{ max-width: 100%; height: auto; border-radius: 3px; }

  .error-box, .empty-box{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 40px;
    text-align: center;
    max-width: 600px;
    margin: 60px auto;
  }
  .error-box h2, .empty-box h2{
    font-family: var(--display);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .error-box p, .empty-box p{
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .mono-hint{
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--ink-soft);
    background: var(--paper);
    padding: 10px 14px;
    border-radius: 3px;
    display: inline-block;
    word-break: break-all;
  }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; gap: 24px; padding: 20px 18px; }
    aside{ position: static; max-height: none; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
    article{ padding: 24px 22px; }
    article h1{ font-size: 1.6rem; }
    article h2{ font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition: none !important; }
  }
  .table-wrap{
    overflow-x: auto;
    margin: 18px 0;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .table-wrap table{
    margin: 0;
    border: none;
    min-width: 100%;
  }
  .table-wrap table th,
  .table-wrap table td{
    white-space: nowrap;
  }

  @media print{
    header, aside{ display: none; }
    .layout{ display: block; padding: 0; }
    article{ border: none; padding: 0; max-width: none; }
    body{ background: #fff; color: #000; }
  }
</style>
<base target="_blank">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <a href="index.html">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="20" y1="4" x2="20" y2="36" stroke="var(--yaz)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="20" y1="4" x2="8" y2="14" stroke="var(--yaz)" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="20" y1="4" x2="32" y2="14" stroke="var(--yaz)" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="20" cy="36" r="2.6" fill="var(--yaz)"/>
        </svg>
        <div class="brand-text">
          Kabyle Specs
          <small>Markdown Viewer</small>
        </div>
      </a>
    </div>
    <div class="header-actions">
      <a class="btn primary" href="index.html">&larr; All documents</a>
      <a class="btn" id="raw-link" href="#" target="_blank" rel="noopener">Raw</a>
      <button class="btn" id="copy-link">Copy link</button>
    </div>
  </div>
</header>

<div class="layout" id="layout" style="display:none;">
  <aside>
    <div class="toc-title">This document</div>
    <div class="doc-card" id="doc-card"></div>
    <div class="toc-title">Table of contents</div>
    <nav class="toc" id="toc"><ul></ul></nav>
  </aside>
  <main>
    <article id="content"></article>
  </main>
</div>

<div id="fallback"></div>

<!-- DOMPurify -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<!-- Marked.js v12 (pinned) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- Highlight.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  (function() {
    'use strict';

    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);
    const fileParam = params.get('file');
    const hash = window.location.hash;

    // ---------- hard limits ----------
    const MAX_BYTES = 2 * 1024 * 1024;   // 2 MiB
    const TIMEOUT_MS = 10000;             // 10 s

    console.log('[viewer] file param:', fileParam);
    console.log('[viewer] libs — marked:', typeof marked, 'DOMPurify:', typeof DOMPurify, 'hljs:', typeof hljs);

    function validatePath(path) {
      if (!path || typeof path !== 'string') return null;
      const p = path.trim();
      if (p.startsWith('/') || p.startsWith('http') || p.startsWith('\\')) return null;
      if (p.includes('..')) return null;
      if (!/\.md$/i.test(p)) return null;
      if (!/^[a-zA-Z0-9._\-\/]+$/.test(p)) return null;
      return p;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function showError(title, message, hint) {
      $('layout').style.display = 'none';
      $('fallback').innerHTML = `
        <div class="error-box">
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(message)}</p>
          ${hint ? `<div class="mono-hint">${escapeHtml(hint)}</div>` : ''}
          <p style="margin-top:18px;"><a class="btn primary" href="index.html" style="text-decoration:none;">&larr; Back to all documents</a></p>
        </div>`;
    }

    function showEmpty() {
      $('layout').style.display = 'none';
      $('fallback').innerHTML = `
        <div class="empty-box">
          <h2>No file specified</h2>
          <p>Add a <code>?file=</code> parameter to view a Markdown document.</p>
          <div class="mono-hint">?file=reports/report_tatoeba_kabyle.md</div>
          <p style="margin-top:18px;"><a class="btn primary" href="index.html" style="text-decoration:none;">&larr; Browse all documents</a></p>
        </div>`;
    }

    // ---------- fetch with size guard & timeout ----------
    async function fetchWithGuard(url, maxBytes, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);

      let response;
      try {
        response = await fetch(url, { signal: controller.signal });
      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('Request timed out (' + timeoutMs + ' ms)');
        throw err;
      }
      clearTimeout(timer);

      if (!response.ok) {
        throw new Error(response.status + ' ' + response.statusText);
      }

      // quick reject via Content-Length header
      const cl = response.headers.get('content-length');
      if (cl && parseInt(cl, 10) > maxBytes) {
        throw new Error('File too large (' + cl + ' bytes > ' + maxBytes + ' bytes limit)');
      }

      // stream-read with hard byte cap
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        let done, value;
        try {
          ({ done, value } = await reader.read());
        } catch (err) {
          reader.cancel();
          throw err;
        }
        if (done) break;
        received += value.length;
        if (received > maxBytes) {
          reader.cancel();
          throw new Error('File too large (exceeds ' + maxBytes + ' bytes while streaming)');
        }
        chunks.push(value);
      }

      const blob = new Blob(chunks);
      return blob.text();
    }

    // ---------- look up this document's metadata in manifest.json ----------
    // Best-effort only: if manifest.json is missing or the path isn't listed,
    // the viewer still renders the file, just without the pretty title/status.
    async function lookupDocMeta(path) {
      try {
        const res = await fetch('./manifest.json');
        if (!res.ok) return null;
        const data = await res.json();
        const all = [...(data.specs || []), ...(data.reports || [])];
        return all.find(d => d.path === path) || null;
      } catch (err) {
        console.warn('[viewer] manifest.json lookup failed:', err);
        return null;
      }
    }

    function renderDocCard(path, meta) {
      const card = $('doc-card');
      if (meta) {
        card.innerHTML = `
          <p class="doc-title">${escapeHtml(meta.title)}</p>
          <div class="doc-path">${escapeHtml(path)}</div>
          <span class="status ${escapeHtml(meta.status || '')}">${escapeHtml(meta.status || 'unlisted')}</span>`;
        document.title = meta.title + ' | Kabyle Language Specs';
      } else {
        card.innerHTML = `<div class="doc-path">${escapeHtml(path)}</div>`;
      }
    }

    // ---------- main ----------
    if (!fileParam) { showEmpty(); return; }

    const path = validatePath(fileParam);
    console.log('[viewer] validated path:', path);

    if (!path) {
      showError(
        'Invalid path',
        'The requested file path is not allowed. Only relative .md paths are accepted.',
        fileParam
      );
      return;
    }

    const url = './' + path;
    $('raw-link').href = url;

    lookupDocMeta(path).then(meta => renderDocCard(path, meta));

    console.log('[viewer] fetching:', url, 'max:', MAX_BYTES, 'timeout:', TIMEOUT_MS);

    fetchWithGuard(url, MAX_BYTES, TIMEOUT_MS)
      .then(text => {
        console.log('[viewer] received bytes:', text.length);
        if (!text.trim()) {
          showError('Empty file', 'The requested Markdown file is empty.', path);
          return;
        }

        if (typeof marked === 'undefined') {
          showError('Parser not loaded', 'marked.js failed to load. Check your network or CDN availability.', '');
          return;
        }

        let html = marked.parse(text, { gfm: true, breaks: false });
        console.log('[viewer] parsed html length:', html.length);

        // sanitize with DOMPurify
        if (typeof DOMPurify !== 'undefined') {
          html = DOMPurify.sanitize(html, {
            ALLOWED_TAGS: [
              'h1','h2','h3','h4','h5','h6','p','br','hr',
              'ul','ol','li','blockquote','strong','em','code','pre',
              'table','thead','tbody','tr','th','td','a','img','div','span'
            ],
            ALLOWED_ATTR: ['href','src','alt','title','id','class','target','rel']
          });
        }

        $('content').innerHTML = html;

        // wrap tables for horizontal scroll on mobile
        document.querySelectorAll('article table').forEach(table => {
          if (table.parentElement.classList.contains('table-wrap')) return;
          const wrap = document.createElement('div');
          wrap.className = 'table-wrap';
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });

        // highlight code blocks
        if (typeof hljs !== 'undefined') {
          document.querySelectorAll('pre code').forEach(block => {
            hljs.highlightElement(block);
          });
        }

        // rewrite relative .md links to viewer links
        document.querySelectorAll('article a').forEach(a => {
          const href = a.getAttribute('href');
          if (!href) return;
          if (href.startsWith('#') || href.startsWith('http') || href.startsWith('mailto:')) return;
          if (/\.md$/i.test(href)) {
            a.setAttribute('href', 'viewer.html?file=' + encodeURIComponent(href));
          }
        });

        // build TOC from headings
        const tocUl = $('toc').querySelector('ul');
        tocUl.innerHTML = '';
        const headings = $('content').querySelectorAll('h2, h3');
        if (headings.length === 0) {
          tocUl.innerHTML = '<li style="color:var(--ink-soft);font-size:0.85rem;">No headings found.</li>';
        }
        headings.forEach((h, i) => {
          const id = 'sec-' + i;
          h.id = id;
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = h.textContent;
          a.className = h.tagName.toLowerCase() === 'h3' ? 'level-h3' : '';
          li.appendChild(a);
          tocUl.appendChild(li);
        });

        $('layout').style.display = '';
        console.log('[viewer] render complete');

        if (hash) {
          const target = document.querySelector(hash);
          if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth' }), 50);
        }
      })
      .catch(err => {
        console.error('[viewer] error:', err);
        showError('Failed to load file', err.message, url);
      });

    $('copy-link').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = $('copy-link');
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = old, 1500);
      });
    });

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const headings = $('content').querySelectorAll('h2, h3');
          let current = '';
          headings.forEach(h => {
            const rect = h.getBoundingClientRect();
            if (rect.top < 120) current = h.id;
          });
          document.querySelectorAll('.toc a').forEach(a => a.classList.remove('active'));
          if (current) {
            const active = document.querySelector('.toc a[href="#' + current + '"]');
            if (active) active.classList.add('active');
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  })();
</script>

</body>
</html>
